name: CI (all platforms)

on:
  push:
    branches:
      - "edidada/main"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10

jobs:
  build-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
          - os: ubuntu-24.04
          - os: ubuntu-26.04
          # arm64 macOS runners are frequently capacity-limited and the job may be
          # cancelled before it starts; keep them in the matrix but don't fail the
          # whole run when that happens.
          - os: macos-15
            best_effort: true
          - os: macos-latest
            best_effort: true
          - os: macos-15-intel
          - os: macos-26-intel
          - os: windows-2022
          - os: windows-2025
    continue-on-error: ${{ matrix.best_effort == true }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # rust-toolchain.toml pins the toolchain; invoking cargo makes rustup install it.
      - name: Show Rust toolchain
        run: cargo --version

      - name: Build workspace
        run: cargo build --workspace

      - name: Test workspace
        run: cargo test --workspace
