name: CI (all platforms)

on:
  push:
    branches:
      # 所有 edidada/ 开头的分支（如 edidada/main、edidada/feature-x）都跑构建 + cargo test
      - "edidada/**"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10

jobs:
  build-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # arm64 macOS images (macos-15 / macos-latest) are omitted: their runners
        # are frequently unavailable and the jobs get cancelled before starting.
        # Both supported macOS versions are still covered by the Intel images.
        os:
          - ubuntu-22.04
          - ubuntu-24.04
          - ubuntu-26.04
          - macos-15-intel
          - macos-26-intel
          - windows-2022
          - windows-2025
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # rust-toolchain.toml pins the toolchain; invoking cargo makes rustup install it.
      - name: Show Rust toolchain
        run: cargo --version

      - name: Build workspace
        run: cargo build --workspace

      - name: Build test targets (IDE-style)
        run: cargo test --color=always --message-format=json-diagnostic-rendered-ansi --no-run --workspace --profile test

      - name: Test workspace
        run: cargo test --workspace
